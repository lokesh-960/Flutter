<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Digital Learning Management System (DLMS) — Advancing UN Sustainable Development Goal 4 (Quality Education) through accessible, inclusive, and self-paced digital learning.">
  <meta name="keywords" content="DLMS, SDG 4, Quality Education, Flutter, Learning Management System, STEM, Open Education">
  <meta name="author" content="DLMS Project Team">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DLMS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Digital Learning Management System | SDG 4 Quality Education</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0B0F19;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0F172A 0%, #1E3A8A 100%);
      color: #FFFFFF;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      border-top-color: #38BDF8;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-title {
      margin-top: 20px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .loading-sub {
      margin-top: 6px;
      font-size: 13px;
      color: #94A3B8;
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="spinner"></div>
    <div class="loading-title">Digital Learning Management System</div>
    <div class="loading-sub">UN SDG 4: Quality Education Platform</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
